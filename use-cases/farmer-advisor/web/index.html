<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Advisor — grow smart, sell smart</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Sinhala:wght@400;600&display=swap"
    rel="stylesheet">
  <script>
    // set theme before first paint to avoid flash
    const saved = localStorage.fa_theme;
    if (saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.classList.add("dark");
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            canvas: "var(--canvas)",
            "canvas-soft": "var(--canvas-soft)",
            hairline: "var(--hairline)",
            ink: "var(--ink)",
            body: "var(--body)",
            mute: "var(--mute)",
            bubble: "var(--bubble-bg)",
            "bubble-ink": "var(--bubble-ink)",
            primary: "#00d992",
            "primary-deep": "#10b981",
          },
          fontFamily: {
            sans: ["Inter", "Noto Sans Sinhala", "system-ui", "sans-serif"],
            mono: ["JetBrains Mono", "Menlo", "Consolas", "monospace"],
          },
          letterSpacing: { eyebrow: "0.18em" },
        },
      },
    };
  </script>
  <style>
    :root {
      --canvas: #f6f8f4;
      --canvas-soft: #ffffff;
      --hairline: #dde5d8;
      --ink: #152218;
      --body: #566357;
      --mute: #829080;
      --bubble-bg: #1e5738;
      --bubble-ink: #ffffff;
      --code-bg: #edf3ea;
      --shimmer-base: #8b949e;
      --shimmer-highlight: #18181b;
      --shimmer-dur: 2000ms;
      --shimmer-band: 400%;
      --shimmer-ease: linear;
      --dropdown-open-dur: 250ms;
      --dropdown-close-dur: 150ms;
      --dropdown-pre-scale: 0.97;
      --dropdown-closing-scale: 0.99;
      --dropdown-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    html.dark {
      --canvas: #101510;
      --canvas-soft: #182019;
      --hairline: #2c3a2d;
      --ink: #f1f6ee;
      --body: #b3beb1;
      --mute: #849383;
      --bubble-bg: #2c8054;
      --bubble-ink: #ffffff;
      --code-bg: #202b21;
      --shimmer-highlight: #f2f2f2;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--canvas);
      color: var(--ink);
      transition: background-color 250ms ease, color 250ms ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(circle at 72% 30%, rgba(70, 177, 102, .13), transparent 27rem), radial-gradient(circle at 28% 88%, rgba(229, 174, 72, .09), transparent 25rem);
    }

    #sidebar {
      box-shadow: 14px 0 38px rgba(28, 54, 32, .05);
    }

    .surface {
      box-shadow: 0 14px 36px rgba(24, 56, 31, .08);
    }

    .icon-button {
      border: 1px solid var(--hairline);
      background: var(--canvas-soft);
      box-shadow: 0 3px 10px rgba(24, 56, 31, .05);
    }

    #chat::-webkit-scrollbar,
    #convo-list::-webkit-scrollbar {
      width: 6px;
    }

    #chat::-webkit-scrollbar-thumb,
    #convo-list::-webkit-scrollbar-thumb {
      background: var(--hairline);
      border-radius: 3px;
    }

    #chips {
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    #chips::-webkit-scrollbar {
      display: none;
    }

    .quick-card {
      border: 1px solid var(--hairline);
      background: var(--canvas);
      box-shadow: 0 8px 24px rgba(24, 56, 31, .06);
    }

    @media (max-width: 639px) {
      #messages {
        padding: 1.25rem 1rem 1rem;
      }

      #chips {
        margin-inline: -0.25rem;
        padding-inline: 0.25rem;
      }

      #chips [data-chip] {
        flex: 0 0 auto;
        max-width: 15.5rem;
        min-width: 12.5rem;
        scroll-snap-align: start;
      }

      #composer {
        padding-bottom: env(safe-area-inset-bottom);
      }
    }

    .msg-body ul {
      list-style: disc;
      margin: 0.25rem 0 0.25rem 1.25rem;
    }

    .msg-body li {
      margin: 0.125rem 0;
    }

    .msg-body code {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85em;
      background: var(--code-bg);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 0 0.3em;
    }

    .caret::after {
      content: "▍";
      color: #10b981;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes pulse-dot {
      50% {
        opacity: 0.4;
      }
    }

    .live-dot {
      animation: pulse-dot 2s ease-in-out infinite;
    }

    /* message entrance */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .anim-in {
      animation: rise 350ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* t-shimmer — transitions.dev shimmer text (pure CSS) */
    .t-shimmer {
      position: relative;
      display: inline-block;
      color: var(--shimmer-base);
    }

    .t-shimmer::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(90deg, transparent 0%, transparent 40%, var(--shimmer-highlight) 50%, transparent 60%, transparent 100%);
      background-size: var(--shimmer-band) 100%;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: t-shimmer var(--shimmer-dur) var(--shimmer-ease) infinite;
    }

    @keyframes t-shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0% 0;
      }
    }

    /* t-dropdown — transitions.dev menu dropdown */
    .t-dropdown {
      transform-origin: top left;
      transform: scale(var(--dropdown-pre-scale));
      opacity: 0;
      pointer-events: none;
      transition: transform var(--dropdown-open-dur) var(--dropdown-ease), opacity var(--dropdown-open-dur) var(--dropdown-ease);
      will-change: transform, opacity;
    }

    .t-dropdown.is-open {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .t-dropdown.is-closing {
      transform: scale(var(--dropdown-closing-scale));
      opacity: 0;
      pointer-events: none;
      transition: transform var(--dropdown-close-dur) var(--dropdown-ease), opacity var(--dropdown-close-dur) var(--dropdown-ease);
    }

    /* mobile sidebar slide */
    #sidebar {
      transition: transform 250ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .t-shimmer::before {
        animation: none !important;
      }

      .t-dropdown,
      #sidebar {
        transition: none !important;
      }

      .anim-in {
        animation: none !important;
      }
    }
  </style>
</head>

<body class="font-sans antialiased">
  <div class="flex h-full overflow-hidden">

    <!-- ══ Sidebar ══ -->
    <aside id="sidebar"
      class="fixed inset-y-0 left-0 z-40 m-0 flex w-72 shrink-0 -translate-x-full flex-col border-r border-hairline bg-canvas-soft lg:static lg:m-3 lg:mr-0 lg:rounded-[26px] lg:border lg:translate-x-0">
      <div class="flex items-center gap-3 px-5 py-4">
        <span class="text-2xl leading-none">🌾</span>
        <div class="min-w-0">

          <h1 class="truncate text-[16px] font-semibold tracking-tight">Farmer Advisor</h1>
          <p class="font-mono text-[10px] font-medium uppercase tracking-eyebrow text-mute"> Agent Kernel - Team ONYX
          </p>
        </div>
        <button id="sidebar-close" class="ml-auto rounded-md p-1.5 text-mute hover:text-ink lg:hidden" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="px-4 pb-3">
        <button id="new-chat"
          class="flex w-full items-center gap-2 rounded-2xl bg-primary px-4 py-3 text-[13px] font-semibold text-[#102416] shadow-sm transition-colors hover:bg-primary-deep">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New chat
        </button>
      </div>

      <p class="px-5 pb-2 font-mono text-[10px] font-medium uppercase tracking-eyebrow text-mute">Chats</p>
      <nav id="convo-list" class="flex-1 space-y-0.5 overflow-y-auto px-3 pb-4"><!-- filled by JS --></nav>

      <div class="mx-4 border-t border-hairline px-1 py-4">
        <p class="mb-2 font-mono text-[10px] font-medium uppercase tracking-eyebrow text-mute">Advisors</p>
        <div id="agent-list" class="space-y-1"><!-- filled by JS --></div>
      </div>

      <div class="mx-4 flex items-center justify-between border-t border-hairline px-1 py-4">
        <span
          class="inline-flex items-center gap-2 rounded-full border border-hairline px-3 py-1 text-[11px] text-body">
          <span id="status-dot" class="h-2 w-2 rounded-full bg-mute"></span><span id="status-text">Connecting…</span>
        </span>
        <span class="font-mono text-[10px] text-mute">SDG 2</span>
      </div>
    </aside>
    <div id="overlay" class="fixed inset-0 z-30 hidden bg-black/40 lg:hidden"></div>

    <!-- ══ Main ══ -->
    <main
      class="flex min-w-0 flex-1 flex-col lg:m-3 lg:ml-5 lg:rounded-[30px] lg:border lg:border-hairline lg:bg-canvas-soft lg:shadow-sm">
      <!-- top bar -->
      <header class="relative flex items-center gap-2 border-b border-hairline px-4 py-3 sm:px-6">
        <button id="sidebar-open" class="rounded-md p-2 text-mute hover:text-ink lg:hidden" title="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>

        <!-- advisor selector -->
        <button id="agent-trigger"
          class="flex items-center gap-2 rounded-2xl px-3 py-2 text-[14px] font-semibold text-ink transition-colors hover:bg-canvas">
          <span id="agent-trigger-label">🧭 Auto</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" class="text-mute">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div id="agent-menu"
          class="surface t-dropdown absolute left-4 top-full z-50 mt-2 w-72 rounded-2xl border border-hairline bg-canvas-soft p-2"
          data-origin="top-left">
          <!-- filled by JS -->
        </div>

        <div class="ml-auto flex items-center gap-1">
          <button id="theme-toggle" class="icon-button rounded-xl p-2 text-mute transition-colors hover:text-ink"
            title="Toggle theme">
            <svg id="icon-sun" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" class="hidden">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg id="icon-moon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" class="hidden">
              <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" />
            </svg>
          </button>
        </div>
      </header>

      <!-- chat -->
      <div id="chat" class="flex-1 overflow-y-auto">
        <div class="mx-auto w-full max-w-3xl px-5 py-8 space-y-6" id="messages"></div>
      </div>

      <!-- composer -->
      <div class="px-5 pb-5 pt-2">
        <div class="mx-auto max-w-3xl">
          <div id="chips" class="mb-3 flex snap-x snap-mandatory flex-nowrap gap-2 overflow-x-auto">
            <!-- filled by JS -->
          </div>
          <form id="composer">
            <div id="img-preview" class="hidden mb-2"></div>
            <div
              class="surface flex items-end gap-2 rounded-[24px] border border-hairline bg-canvas px-3 py-2.5 transition-colors focus-within:border-primary-deep focus-within:ring-4 focus-within:ring-primary/10">
              <label for="file-input" class="cursor-pointer rounded-md p-2 text-mute transition-colors hover:text-ink"
                title="Attach a plant photo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <path d="m21 15-5-5L5 21" />
                </svg>
              </label>
              <input id="file-input" type="file" accept="image/*" class="hidden">
              <textarea id="box" rows="1" placeholder="Ask about your crops…" autocomplete="off"
                class="max-h-40 flex-1 resize-none bg-transparent py-1.5 text-[15px] leading-relaxed text-ink placeholder:text-mute outline-none"></textarea>
              <button id="send" type="submit" title="Send"
                class="rounded-2xl bg-primary p-2.5 text-[#102416] shadow-sm transition-opacity disabled:cursor-not-allowed disabled:opacity-40">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5m-7 7 7-7 7 7" />
                </svg>
              </button>
            </div>
            <p class="mt-2 text-center text-[11px] text-mute">Advice is informational — confirm pesticides &amp; doses
              with your local agri officer.</p>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script>
    "use strict";
    const API_BASE = location.protocol.startsWith("http") ? location.origin : "http://localhost:8000";
    const CHAT_URL = `${API_BASE}/api/v1/chat`;

    const AGENTS = [
      { id: "orchestrator", icon: "🧭", label: "Auto", desc: "Smart routing — picks the right specialist for you" },
      { id: "crop_disease", icon: "🌱", label: "Plant Doctor", desc: "Diagnoses diseases from symptoms or photos" },
      { id: "market_price", icon: "💰", label: "Market Watch", desc: "Crop prices across markets" },
      { id: "weather", icon: "⛅", label: "Sky Watch", desc: "3-day forecast + spray & irrigation advice" },
    ];
    const CHIPS = [
      "🌱 මගේ වී කොළ වල අළු පැල්ලම් තියෙනවා",
      "💰 දඹුල්ලේ තක්කාලි මිල කීයද?",
      "⛅ හෙට නුවර spray කරන්න හොඳද?",
      "☔ මේ සතියේ වැස්ස කොහොමද?",
    ];
    // thinking-status scripts per domain; cycled while waiting for the first token
    const THINKING = {
      crop_disease: ["🧭 Routing to Plant Doctor…", "🌱 Plant Doctor is examining the symptoms…", "📖 Checking the disease knowledge base…", "✍️ Writing treatment advice…"],
      market_price: ["🧭 Routing to Market Watch…", "💰 Market Watch is checking today's prices…", "📊 Comparing markets…", "✍️ Summarising for you…"],
      weather: ["🧭 Routing to Sky Watch…", "⛅ Sky Watch is fetching the forecast…", "🌦️ Reading rain & wind for your area…", "✍️ Preparing spray advice…"],
      generic: ["🧭 Reading your question…", "🤔 Picking the right advisor…", "🛠️ Working on it…", "✍️ Writing a reply…"],
    };

    const $ = (id) => document.getElementById(id);
    const chat = $("chat"), messages = $("messages"), box = $("box"), send = $("send"), fileInput = $("file-input");
    let pendingImage = null;
    let busy = false;
    let selectedAgent = localStorage.fa_agent || "orchestrator";

    /* ── conversation store ── */
    let convos = JSON.parse(localStorage.fa_convos || "[]"); // [{id, sid, title, messages:[{role,text,img}], ts}]
    let activeId = localStorage.fa_active || null;
    function saveConvos() {
      convos = convos.slice(0, 50);
      localStorage.fa_convos = JSON.stringify(convos);
      localStorage.fa_active = activeId || "";
    }
    function activeConvo() { return convos.find((c) => c.id === activeId); }
    function newConvo() {
      const c = { id: crypto.randomUUID(), sid: crypto.randomUUID(), title: "New chat", messages: [], ts: Date.now() };
      convos.unshift(c); activeId = c.id; saveConvos();
      return c;
    }

    /* ── tiny markdown: bold, `code`, bullets ── */
    function md(t) {
      t = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
      let out = "", inList = false;
      for (const l of t.split("\n")) {
        if (/^\s*[*-] /.test(l)) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + l.replace(/^\s*[*-] /, "") + "</li>"; }
        else { if (inList) { out += "</ul>"; inList = false; } out += l + "<br>"; }
      }
      return out + (inList ? "</ul>" : "");
    }

    /* ── rendering ── */
    function renderMessage(m, animate = true) {
      const wrap = document.createElement("div");
      const anim = animate ? " anim-in" : "";
      if (m.role === "user") {
        wrap.className = "flex justify-end" + anim;
        wrap.innerHTML = `
      <div class="max-w-[80%] rounded-[22px] rounded-br-md bg-bubble px-4 py-3 text-[14.5px] leading-relaxed text-bubble-ink shadow-sm">
        ${m.img ? `<img src="${m.img}" alt="attached photo" class="mb-2 max-h-48 rounded-lg">` : ""}
        <div class="msg-body">${md(m.text)}</div>
      </div>`;
      } else {
        wrap.className = "flex gap-3" + anim;
        wrap.innerHTML = `
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl border border-hairline bg-canvas-soft text-[14px] shadow-sm">🌾</div>
      <div class="min-w-0 flex-1 pt-0.5 text-[14.5px] leading-relaxed text-ink">
        <div class="msg-body">${md(m.text)}</div>
      </div>`;
      }
      messages.appendChild(wrap);
      return wrap;
    }
    function renderEmptyState() {
      const d = document.createElement("div");
      d.id = "empty-state";
      d.className = "flex min-h-full flex-col justify-center py-8 text-center anim-in";
      d.innerHTML = `
    <div class="mx-auto mb-5 flex h-14 w-14 items-center justify-center rounded-[20px] bg-primary text-3xl shadow-lg shadow-primary/20">🌾</div>
    <p class="mb-4 font-mono text-[10px] font-medium uppercase tracking-eyebrow text-mute">Crop diseases · Market prices · Weather</p>
    <h2 class="text-3xl font-semibold tracking-tight text-ink sm:text-4xl">Grow smarter, season after season.</h2>
    <p class="mx-auto mt-3 max-w-md text-[15px] leading-relaxed text-body">Ask in English or සිංහල — type a question, or share a photo of a sick plant.</p>
    
    <p class="mt-5 text-[12px] text-mute">Choose a topic to get started, or use the message box below.</p>`;
      messages.appendChild(d);
      d.querySelectorAll("[data-empty-prompt]").forEach((button) => button.addEventListener("click", () => sendMessage(button.dataset.emptyPrompt)));
    }
    function renderConversation() {
      messages.innerHTML = "";
      const c = activeConvo();
      if (!c || !c.messages.length) renderEmptyState();
      else c.messages.forEach((m) => renderMessage(m, false));
      scrollDown(true);
    }
    function nearBottom() { return chat.scrollHeight - chat.scrollTop - chat.clientHeight < 120; }
    function scrollDown(force = false) { if (force || nearBottom()) chat.scrollTop = chat.scrollHeight; }

    /* ── sidebar: history ── */
    function renderSidebar() {
      const list = $("convo-list");
      list.innerHTML = convos.map((c) => `
    <div data-convo="${c.id}" class="group flex cursor-pointer items-center gap-2 rounded-xl px-3 py-2.5 text-[13px] transition-colors ${c.id === activeId ? "bg-canvas text-ink border border-hairline shadow-sm" : "text-body hover:bg-canvas hover:text-ink border border-transparent"}">
      <span class="min-w-0 flex-1 truncate">${c.title.replace(/</g, "&lt;")}</span>
      <button data-del="${c.id}" class="hidden shrink-0 rounded p-1 text-mute hover:text-ink group-hover:block" title="Delete chat">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg>
      </button>
    </div>`).join("") || `<p class="px-2.5 py-2 text-[12px] text-mute">No chats yet</p>`;
      list.querySelectorAll("[data-convo]").forEach((el) => el.addEventListener("click", (e) => {
        if (e.target.closest("[data-del]")) return;
        if (busy) return; // ponytail: no convo switching mid-stream; add per-convo request state if it ever matters
        activeId = el.dataset.convo; saveConvos(); renderSidebar(); renderConversation(); closeSidebar();
      }));
      list.querySelectorAll("[data-del]").forEach((el) => el.addEventListener("click", () => {
        if (busy) return;
        convos = convos.filter((c) => c.id !== el.dataset.del);
        if (activeId === el.dataset.del) activeId = convos[0]?.id || null;
        saveConvos(); renderSidebar(); renderConversation();
      }));
    }

    /* ── agent selector dropdown (transitions.dev menu dropdown) ── */
    const agentMenu = $("agent-menu"), agentTrigger = $("agent-trigger");
    const closeMs = 150;
    let menuOpen = false;
    function renderAgentMenu() {
      agentMenu.innerHTML = AGENTS.map((a) => `
    <button type="button" data-agent="${a.id}" class="flex w-full items-start gap-3 rounded-xl px-3 py-2.5 text-left transition-colors hover:bg-canvas">
      <span class="pt-0.5 text-[16px]">${a.icon}</span>
      <span class="min-w-0 flex-1">
        <span class="block text-[13.5px] font-semibold text-ink">${a.label}</span>
        <span class="block text-[12px] leading-snug text-body">${a.desc}</span>
      </span>
      ${a.id === selectedAgent ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mt-1 shrink-0"><path d="M20 6 9 17l-5-5"/></svg>' : ""}
    </button>`).join("");
      const a = AGENTS.find((x) => x.id === selectedAgent);
      $("agent-trigger-label").textContent = `${a.icon} ${a.label}`;
      agentMenu.querySelectorAll("[data-agent]").forEach((el) => el.addEventListener("click", () => {
        selectedAgent = el.dataset.agent; localStorage.fa_agent = selectedAgent;
        renderAgentMenu(); closeMenu();
      }));
    }
    function openMenu() { agentMenu.classList.remove("is-closing"); agentMenu.classList.add("is-open"); menuOpen = true; }
    function closeMenu() {
      agentMenu.classList.remove("is-open"); agentMenu.classList.add("is-closing"); menuOpen = false;
      setTimeout(() => agentMenu.classList.remove("is-closing"), closeMs);
    }
    agentTrigger.addEventListener("click", (e) => { e.stopPropagation(); menuOpen ? closeMenu() : openMenu(); });
    document.addEventListener("click", (e) => { if (menuOpen && !agentMenu.contains(e.target)) closeMenu(); });

    /* ── theme toggle ── */
    function applyThemeIcon() {
      const dark = document.documentElement.classList.contains("dark");
      $("icon-sun").classList.toggle("hidden", !dark);
      $("icon-moon").classList.toggle("hidden", dark);
    }
    $("theme-toggle").addEventListener("click", () => {
      const dark = document.documentElement.classList.toggle("dark");
      localStorage.fa_theme = dark ? "dark" : "light";
      applyThemeIcon();
    });
    applyThemeIcon();

    /* ── mobile sidebar ── */
    function openSidebar() { $("sidebar").classList.remove("-translate-x-full"); $("overlay").classList.remove("hidden"); }
    function closeSidebar() { $("sidebar").classList.add("-translate-x-full"); $("overlay").classList.add("hidden"); }
    $("sidebar-open").addEventListener("click", openSidebar);
    $("sidebar-close").addEventListener("click", closeSidebar);
    $("overlay").addEventListener("click", closeSidebar);

    /* ── thinking status ── */
    function guessDomain(text, hasImage) {
      if (selectedAgent !== "orchestrator") return selectedAgent;
      if (hasImage) return "crop_disease";
      const t = text.toLowerCase();
      if (/(disease|spot|leaf|leaves|pest|fungus|wilt|රෝග|කොළ|පළිබෝධ)/.test(t)) return "crop_disease";
      if (/(price|market|sell|මිල|වෙළඳ)/.test(t)) return "market_price";
      if (/(weather|rain|spray|irrigat|forecast|කාලගුණ|වැස්ස|වැසි)/.test(t)) return "weather";
      return "generic";
    }
    function startThinking(el, domain) {
      const words = THINKING[domain] || THINKING.generic;
      let i = 0;
      const span = document.createElement("span");
      span.className = "t-shimmer text-[14px]";
      span.textContent = words[0]; span.dataset.text = words[0];
      el.appendChild(span);
      const timer = setInterval(() => {
        i = (i + 1) % words.length;
        span.textContent = words[i]; span.dataset.text = words[i];
      }, 2200);
      return () => { clearInterval(timer); span.remove(); };
    }

    /* ── sending ── */
    async function sendMessage(text) {
      if (busy || (!text.trim() && !pendingImage)) return;
      busy = true; send.disabled = true;

      let c = activeConvo() || newConvo();
      const userMsg = { role: "user", text: text.trim() || "(photo)", img: pendingImage?.dataUri || null };
      c.messages.push(userMsg);
      if (c.title === "New chat") c.title = userMsg.text.slice(0, 42);
      c.ts = Date.now(); saveConvos(); renderSidebar();
      $("empty-state")?.remove();
      renderMessage(userMsg); scrollDown(true);

      const payload = { prompt: text.trim() || "Please look at this photo of my plant.", agent: selectedAgent, session_id: c.sid };
      if (pendingImage) payload.images = [{ image_data: pendingImage.dataUri, name: pendingImage.name, mime_type: pendingImage.mime }];
      const domain = guessDomain(payload.prompt, !!pendingImage);
      clearImage(); box.value = ""; autosize();

      const botMsg = { role: "bot", text: "" };
      const el = renderMessage(botMsg);
      const bodyEl = el.querySelector(".msg-body");
      bodyEl.innerHTML = "";
      const stopThinking = startThinking(bodyEl, domain);
      scrollDown(true);
      let firstToken = true;

      try {
        const r = await fetch(CHAT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        const ctype = r.headers.get("content-type") || "";

        if (!r.ok) {
          const detail = await r.json().catch(() => ({}));
          botMsg.text = detail?.detail?.error || "Something went wrong. Please try again.";
        } else if (ctype.includes("text/event-stream")) {
          const reader = r.body.getReader(), decoder = new TextDecoder();
          let buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += decoder.decode(value, { stream: true });
            const frames = buf.split("\n\n"); buf = frames.pop();
            for (const f of frames) {
              const line = f.trim(); if (!line.startsWith("data:")) continue;
              let evt; try { evt = JSON.parse(line.slice(5)); } catch { continue; }
              if (evt.delta) {
                if (firstToken) { stopThinking(); bodyEl.classList.add("caret"); firstToken = false; }
                botMsg.text += evt.delta; bodyEl.innerHTML = md(botMsg.text); scrollDown();
              }
              if (evt.error) botMsg.text = evt.error;
              if (evt.session_id) c.sid = evt.session_id;
            }
          }
        } else { // sync JSON fallback (execution.mode != stream)
          const data = await r.json();
          botMsg.text = data.result ?? data.error ?? "Something went wrong. Please try again.";
          if (data.session_id) c.sid = data.session_id;
        }
      } catch {
        botMsg.text = "⚠ Can't reach the server. Is `python main.py serve` running?";
      }

      stopThinking();
      if (!botMsg.text) botMsg.text = "Sorry, I didn't get a reply. Please try again.";
      bodyEl.classList.remove("caret");
      bodyEl.innerHTML = md(botMsg.text);
      c.messages.push(botMsg); c.messages = c.messages.slice(-200); saveConvos();
      scrollDown();
      busy = false; send.disabled = false; box.focus();
    }

    /* ── image attach ── */
    function clearImage() { pendingImage = null; $("img-preview").classList.add("hidden"); $("img-preview").innerHTML = ""; fileInput.value = ""; }
    fileInput.addEventListener("change", () => {
      const f = fileInput.files[0]; if (!f) return;
      if (f.size > 8 * 1024 * 1024) { alert("Image too large (max 8 MB)."); fileInput.value = ""; return; }
      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = { dataUri: reader.result, name: f.name, mime: f.type || "image/jpeg" };
        const p = $("img-preview");
        p.innerHTML = `
      <span class="anim-in inline-flex items-center gap-2 rounded-lg border border-hairline bg-canvas-soft px-2 py-1.5">
        <img src="${reader.result}" alt="" class="h-10 w-10 rounded-md object-cover">
        <span class="font-mono text-[11px] text-body">${f.name.replace(/</g, "&lt;")}</span>
        <button type="button" id="img-remove" class="px-1 text-mute hover:text-ink">✕</button>
      </span>`;
        p.classList.remove("hidden");
        $("img-remove").addEventListener("click", clearImage);
      };
      reader.readAsDataURL(f);
    });

    /* ── composer ── */
    function autosize() { box.style.height = "auto"; box.style.height = Math.min(box.scrollHeight, 160) + "px"; }
    box.addEventListener("input", autosize);
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(box.value); } });
    $("composer").addEventListener("submit", (e) => { e.preventDefault(); sendMessage(box.value); });

    /* ── new chat ── */
    $("new-chat").addEventListener("click", () => {
      if (busy) return;
      newConvo(); renderSidebar(); renderConversation(); closeSidebar(); box.focus();
    });

    /* ── chips ── */
    $("chips").innerHTML = CHIPS.map((t) =>
      `<button type="button" data-chip title="${t}" class="min-w-0 flex-1 truncate whitespace-nowrap rounded-full border border-hairline bg-canvas-soft px-3 py-2 text-center text-[12px] text-body shadow-sm transition-colors hover:border-primary-deep hover:text-ink">${t}</button>`).join("");
    document.querySelectorAll("[data-chip]").forEach((b) => b.addEventListener("click", () => sendMessage(b.textContent.trim().replace(/^\S+\s/, ""))));

    /* ── advisors + health ── */
    function renderAgents(liveNames) {
      $("agent-list").innerHTML = AGENTS.slice(1).map((a) => `
    <div class="flex items-center gap-2 rounded-md px-1 py-1 text-[12.5px] text-body">
      <span>${a.icon}</span><span class="flex-1">${a.label}</span>
      ${liveNames?.includes(a.id) ? '<span class="live-dot h-1.5 w-1.5 rounded-full bg-primary"></span>' : '<span class="h-1.5 w-1.5 rounded-full bg-mute"></span>'}
    </div>`).join("");
    }
    async function checkStatus() {
      try {
        const r = await fetch(`${API_BASE}/health`);
        $("status-dot").className = r.ok ? "live-dot h-2 w-2 rounded-full bg-primary" : "h-2 w-2 rounded-full bg-mute";
        $("status-text").textContent = r.ok ? "Online" : "Offline";
        const a = await fetch(`${API_BASE}/api/v1/agents`).then((x) => x.json());
        renderAgents(a.agents || []);
      } catch {
        $("status-dot").className = "h-2 w-2 rounded-full bg-mute";
        $("status-text").textContent = "Offline";
        renderAgents(null);
      }
    }

    /* ── boot ── */
    if (!convos.length || !activeConvo()) { activeId = convos[0]?.id || null; }
    renderAgentMenu();
    renderAgents(null);
    renderSidebar();
    renderConversation();
    checkStatus(); setInterval(checkStatus, 30000);
    box.focus();
  </script>
</body>

</html>
