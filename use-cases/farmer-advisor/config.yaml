# Agent Kernel configuration for Farmer Advisor
session:
  type: in_memory # switch to redis for production

api:
  custom_router_prefix: "" # serve the web chat UI at / instead of /custom/

whatsapp:
  agent: orchestrator
  agent_acknowledgement: "Got it, checking for you..."
  # verify_token / access_token / app_secret / phone_number_id come from env (AK_WHATSAPP__*)

telegram:
  agent: orchestrator
  # bot_token / webhook_secret come from env (AK_TELEGRAM__*)

logging:
  ak:
    level: WARNING # INFO is noisy in the chat UI
